<!-- src/templates/admin/sections/two_factor_modal.html -->
<div class="modal fade" id="twoFactorModal" tabindex="-1" aria-labelledby="twoFactorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm" style="max-width: 460px;">
        <div class="modal-content bansi-card border-0 shadow-lg">
            <div class="modal-header border-bottom pb-2">
                <h6 class="modal-title fw-bold d-flex align-items-center gap-2" id="twoFactorModalLabel" style="color: var(--text-heading);">
                    <i class="ri-shield-keyhole-line text-danger fs-5"></i>
                    <span>Two-Factor Authentication Setup</span>
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="twoFactorForm">
                <div class="modal-body py-3">
                    <div class="text-center mb-3">
                        <div class="rounded-circle bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center mb-2" style="width: 52px; height: 52px;">
                            <i class="ri-mail-lock-line fs-3"></i>
                        </div>
                        <h6 class="fw-bold mb-1" style="color: var(--text-heading);">Enter Security Code</h6>
                        <p class="text-muted small mb-0" id="twoFactorHelpText">
                            We have dispatched a one-time verification code to your registered administrator email address:
                        </p>
                        <div class="fw-bold font-monospace small text-primary mt-1" id="twoFactorEmailTarget">{{ admin_user.email if admin_user else 'admin@bansigo.store' }}</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-center d-block" for="twoFactorOtpInput">6-Digit Verification Code</label>
                        <input type="text" class="form-control bansi-input text-center font-monospace fw-bold fs-4 py-2" id="twoFactorOtpInput" name="code"
                               maxlength="8" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="one-time-code" style="letter-spacing: 0.3em;">
                    </div>

                    <div class="d-flex justify-content-between align-items-center small text-muted">
                        <span>Didn't receive the code?</span>
                        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" id="resend2faBtn">
                            <i class="ri-refresh-line me-1"></i> Resend Email
                        </button>
                    </div>
                </div>
                <div class="modal-footer border-top pt-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-bansi-red px-3" id="submit2faBtn">
                        <i class="ri-check-line me-1"></i> Verify & Enable 2FA
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
