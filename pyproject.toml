[project]
name = "bansigo-server"
version = "0.1.0"
description = "BansiGo backend: FastAPI + async SQLAlchemy"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "pydantic-settings>=2.15.0",
    "aiomysql>=0.3.2",
    "asyncpg>=0.31.0",
    "cryptography>=43.0.0",
    "passlib>=1.7.4",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.15.1",
    "aiosmtplib>=5.1.3",
    "pathlib>=1.0.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
